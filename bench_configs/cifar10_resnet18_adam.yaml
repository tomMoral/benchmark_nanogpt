# AdamW recipe for ResNet-18 / CIFAR-10 aimed at ~5% top-1 test error.
#
# Differs from the nanogpt Adam defaults: batch 128 (vs 64), 200 epochs of
# steps (vs ~12), non-zero decoupled weight decay (vs 0), and warmup/warmdown
# rescaled to the longer run. The objective `value` is the top-1 test error
# (the ResNet returns it as its eval metric), so target ~0.05.
#
# Run with:
#   benchopt run . --config bench_configs/cifar10_resnet18_adam.yaml
objective:
  - Deep Learning Optimization with NanoGPT

dataset:
  - CIFAR-10

solver:
  - Adam[learning_rate=0.001,weight_decay=0.05,num_steps=78000,batch_size=128,warmup_iters=2000,warmdown_iters=39000,slurm_nodes=1,sin_init=False]

n-repetitions: 1
timeout: 14400
